// ── Water Soundscape ──────────────────────────────────────
class WaterSound{
  constructor(){this.on=false;this.nodes=[];this.masterVol=null;}
  async start(){
    if(this.on)return;
    await Tone.start();audioUnlocked=true;
    this.masterVol=new Tone.Volume(-20).toDestination();
    const rumble=new Tone.Noise("brown");
    const rf=new Tone.Filter({frequency:200,type:"lowpass",rolloff:-24});
    const rv=new Tone.Volume(-10);
    const rt=new Tone.Tremolo({frequency:0.3,depth:0.15}).start();
    rumble.connect(rf);rf.connect(rt);rt.connect(rv);rv.connect(this.masterVol);rumble.start();
    const stream=new Tone.Noise("pink");
    const sf=new Tone.Filter({frequency:900,type:"bandpass",Q:0.4});
    const sf2=new Tone.Filter({frequency:2200,type:"lowpass",rolloff:-12});
    const sv=new Tone.Volume(-5);
    const st=new Tone.Tremolo({frequency:0.18,depth:0.2}).start();
    stream.connect(sf);sf.connect(sf2);sf2.connect(st);st.connect(sv);sv.connect(this.masterVol);stream.start();
    const sparkle=new Tone.Noise("white");
    const spf=new Tone.Filter({frequency:3500,type:"highpass"});
    const spf2=new Tone.Filter({frequency:6000,type:"lowpass"});
    const spv=new Tone.Volume(-24);
    const spt=new Tone.Tremolo({frequency:0.8,depth:0.5}).start();
    sparkle.connect(spf);spf.connect(spf2);spf2.connect(spt);spt.connect(spv);spv.connect(this.masterVol);sparkle.start();
    const drop=new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.001,decay:0.4,sustain:0,release:0.3},volume:-30});
    const dr=new Tone.Reverb({decay:3,wet:0.6}).connect(this.masterVol);
    drop.connect(dr);
    const dns=["C5","E5","G5","A5","D5","B4"];let di=0;
    const dl=new Tone.Loop(t=>{if(Math.random()>0.45)drop.triggerAttackRelease(dns[di++%dns.length],"32n",t);},"4n");
    Tone.getTransport().bpm.value=60;Tone.getTransport().start();dl.start(0);
    this.on=true;this.nodes=[rumble,stream,sparkle,drop,dl,rf,sf,sf2,spf,spf2,rt,st,spt,rv,sv,spv,dr];
  }
  dim(yes){this.masterVol?.volume.rampTo(yes?-32:-20,1.5);}
  async stop(){Tone.getTransport().stop();this.nodes.forEach(n=>{try{n.dispose();}catch{}});this.on=false;this.nodes=[];this.masterVol=null;}
}
const water=new WaterSound();

// ── Setup Screen ──────────────────────────────────────────
function SetupScreen({onSave}){
  const [key,setKey]=useState("");
  const [err,setErr]=useState("");
  const [testing,setTesting]=useState(false);
  const test=async()=>{
    if(!key.trim()){setErr("Please paste your Groq API key.");return;}
    if(!key.startsWith("gsk_")){setErr("Key should start with gsk_...");return;}
    setTesting(true);setErr("");
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key.trim()}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:10,messages:[{role:"user",content:"hi"}]})});
      const d=await res.json();
      if(d.choices?.[0]?.message?.content){onSave(key.trim());}
      else setErr("Key didn't work — please check and try again.");
    }catch{setErr("Connection error. Please check you're online.");}
    setTesting(false);
  };
  return <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${C.forest} 0%,${C.mid} 60%,${C.sage} 100%)`,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>

        <p style={{color:C.stone,fontSize:13,marginTop:8,fontStyle:"italic"}}>Your space to feel better, every day.</p>
      </div>
      <div style={{background:C.dew,borderRadius:12,padding:14,marginBottom:20,fontSize:13,color:C.forest,lineHeight:1.9}}>
        <strong>Get your free Groq key:</strong><br/>
        1. Go to <strong>console.groq.com</strong><br/>
        2. Sign up free — no card needed ✅<br/>
        3. API Keys → Create API Key<br/>
        4. Copy & paste below
      </div>
      <input value={key} onChange={e=>setKey(e.target.value)} placeholder="gsk_..." style={{width:"100%",padding:"13px 16px",borderRadius:12,border:`1.5px solid ${err?C.sage:C.mist}`,fontSize:13,color:C.black,background:C.white,outline:"none",boxSizing:"border-box",marginBottom:8,fontFamily:"monospace"}}/>
      {err&&<div style={{color:"#8B3A3A",fontSize:12,marginBottom:10,padding:"8px 12px",background:"#FFF0F0",borderRadius:8}}>{err}</div>}
      <button onClick={test} disabled={testing} style={{...pill(`linear-gradient(135deg,${C.forest},${C.mid})`,C.white),width:"100%",opacity:testing?0.7:1,marginTop:4}}>{testing?"Testing…":"Start your journey 🌿"}</button>
      <p style={{color:C.stone,fontSize:11,textAlign:"center",marginTop:16,lineHeight:1.6}}>Your key stays on your device only. Private & secure.</p>
    </div>
  </div>;
}

          {micState==="listening"&&<><div style={{position:"absolute",top:"50%",left:"50%",width:74,height:74,borderRadius:"50%",border:`2px solid ${C.sage}`,animation:"ripple 1.6s ease-out infinite"}}/><div style={{position:"absolute",top:"50%",left:"50%",width:74,height:74,borderRadius:"50%",border:`2px solid ${C.sage}`,animation:"ripple 1.6s ease-out 0.6s infinite"}}/></>}
          <button onClick={handleMicTap} style={{width:68,height:68,borderRadius:"50%",background:micBg,border:"none",cursor:"pointer",fontSize:26,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(28,58,32,0.3)",position:"relative",zIndex:1,transition:"background 0.3s"}}>
            {micState==="listening"?"⏹":micState==="processing"?"⏳":"🎙️"}
          </button>
        </div>
        <div style={{fontSize:11,color:C.stone}}>{micState==="listening"?"Tap to stop":micState==="processing"?"Processing…":"Tap to speak"}</div>
      </div>
      <div style={{display:"flex",alignItems:"center",background:C.white,borderRadius:50,padding:"4px 6px 4px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.07)",border:`1px solid ${C.dew}`}}>
        <input value={inputText} onChange={e=>setInputText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}}} placeholder="…or type here" style={{flex:1,border:"none",outline:"none",fontFamily:"inherit",fontSize:13,color:C.black,background:"transparent",padding:"9px 0"}}/>
        <button onClick={handleSend} style={{background:inputText.trim()?`linear-gradient(135deg,${C.forest},${C.mid})`:C.mist,border:"none",borderRadius:"50%",width:38,height:38,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:C.white,flexShrink:0,transition:"background 0.2s"}}>↑</button>
      </div>
    </div>
  </div>;
}

// ── Meditate Screen ───────────────────────────────────────
function MeditateScreen({mOn,mBusy,mToggle}){
  const [active,setActive]=useState(null);
  const [seconds,setSeconds]=useState(0);
  const [running,setRunning]=useState(false);
  const timer=useRef(null);

  const start=(med)=>{
    setActive(med);setSeconds(0);setRunning(true);
    timer.current=setInterval(()=>setSeconds(s=>s+1),1000);
  };
  const stop=()=>{clearInterval(timer.current);setRunning(false);setActive(null);setSeconds(0);};
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

  return <div className="scroll" style={{paddingBottom:90,minHeight:"100vh",background:C.cream}}>
    <div style={{background:`linear-gradient(160deg,${C.forest},${C.mid})`,padding:"52px 20px 24px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><Logo size={22} color={C.white}/><p style={{color:"rgba(255,255,255,0.7)",fontSize:12,marginTop:4}}>Guided Meditations</p></div>
        <button onClick={mToggle} disabled={mBusy} style={{background:mOn?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.1)",border:`1px solid rgba(255,255,255,${mOn?0.4:0.15})`,borderRadius:50,padding:"6px 12px",color:"rgba(255,255,255,0.85)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{mOn?"🌊 On":"🌊 Sound"}</button>
      </div>
    </div>

    {active ? (
      <div style={{padding:20,textAlign:"center"}}>
        <div style={{...card,padding:40}}>
          <div style={{fontSize:48,marginBottom:16}}>{active.icon}</div>
          <h2 style={{color:C.forest,fontSize:22,marginBottom:8}}>{active.title}</h2>
          <p style={{color:C.stone,fontSize:13,marginBottom:24}}>{active.desc}</p>
          <div style={{fontSize:48,fontWeight:"bold",color:C.forest,marginBottom:8,fontVariantNumeric:"tabular-nums"}}>{fmt(seconds)}</div>
          <p style={{color:C.stone,fontSize:12,marginBottom:28,fontStyle:"italic"}}>Breathe gently. You're doing beautifully.</p>
          <button onClick={stop} style={{...pill(`linear-gradient(135deg,${C.forest},${C.mid})`,C.white)}}>End session</button>
        </div>
        <div style={{...card,background:C.dew,marginTop:0}}>
          <p style={{color:C.forest,fontSize:13,lineHeight:1.8,fontStyle:"italic"}}>"Just be here. Breathe. Let everything else wait."</p>
        </div>
      </div>
    ) : (
      <div style={{padding:"16px 16px 0"}}>
        <p style={{color:C.stone,fontSize:13,marginBottom:16,lineHeight:1.7}}>Just a few minutes each day can help you feel calmer, clearer, and more in control.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          {MEDITATIONS.map(m=><button key={m.id} onClick={()=>start(m)} style={{background:C.warm,border:`1px solid ${C.mist}`,borderRadius:16,padding:16,cursor:"pointer",textAlign:"left",fontFamily:"inherit",transition:"all 0.2s",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
            <div style={{fontSize:28,marginBottom:8}}>{m.icon}</div>
            <div style={{color:C.forest,fontSize:13,fontWeight:"bold"}}>{m.title}</div>
            <div style={{color:C.stone,fontSize:11,marginTop:4}}>{m.duration}</div>
            <div style={{color:C.stone,fontSize:10,marginTop:4,lineHeight:1.4}}>{m.desc}</div>
          </button>)}
        </div>
        <div style={{...card,background:C.dew,border:`1px solid ${C.mist}`}}>
          <p style={{color:C.forest,fontSize:12,lineHeight:1.7}}>💚 <strong>5 minutes a day</strong> is all it takes to reset. Build a streak and strengthen your habit.</p>
        </div>
      </div>
    )}
  </div>;
}

      <div style={{...card,textAlign:"center",padding:"36px 20px"}}>

// ── Main App ──────────────────────────────────────────────
function App(){
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("fern_key")||"");
  const [screen,setScreen]=useState("home");
  const [mOn,setMOn]=useState(false);
  const [mBusy,setMBusy]=useState(false);
  const [messages,setMessages]=useState([]);
  const [inputText,setInputText]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [micState,setMicState]=useState("idle");
  const [speaking,setSpeaking]=useState(false);
  const [mood,setMood]=useState(null);
  const [moodNote,setMoodNote]=useState("");
  const [moodSaved,setMoodSaved]=useState(false);
  const [moodHistory,setMoodHistory]=useState([]);
  const [streak]=useState(4);
  const [greeted,setGreeted]=useState(false);
  const [dailyPick]=useState(DAILY_PICKS[new Date().getDay()%DAILY_PICKS.length]);

  const msgsRef=useRef([]);
  const loadRef=useRef(false);
  const recRef=useRef(null);
  const ttsRef=useRef(window.speechSynthesis);

  useEffect(()=>{msgsRef.current=messages;},[messages]);
  useEffect(()=>{if(mOn)water.dim(speaking);},[speaking,mOn]);
  useEffect(()=>{if(screen==="talk"&&!greeted&&apiKey){setGreeted(true);callFern("Hi, I just opened the app. I'm here and I need someone to talk to.",true);}  },[screen,apiKey]);

  const saveKey=(k)=>{localStorage.setItem("fern_key",k);setApiKey(k);};

  const speak=useCallback((text)=>{
    ttsRef.current?.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.rate=0.78;u.pitch=0.95;u.volume=1;
      const vs=ttsRef.current?.getVoices()||[];
      const v=vs.find(v=>v.name==="Samantha")||vs.find(v=>v.name==="Karen")||vs.find(v=>v.name==="Moira")||vs.find(v=>v.name==="Serena")||vs.find(v=>v.name.includes("Zira"))||vs.find(v=>v.lang==="en-GB"&&v.localService)||vs.find(v=>v.lang.startsWith("en")&&v.localService)||vs.find(v=>v.lang.startsWith("en"));
      if(v)u.voice=v;
      u.onstart=()=>setSpeaking(true);u.onend=()=>setSpeaking(false);u.onerror=()=>setSpeaking(false);
      ttsRef.current?.speak(u);
    },200);
  },[]);

  const callFern=useCallback(async(userText,isGreeting=false)=>{
    if(loadRef.current)return;loadRef.current=true;setAiLoading(true);
    const userMsg={role:"user",content:userText};
    const history=isGreeting?[userMsg]:[...msgsRef.current,userMsg];
    if(!isGreeting)setMessages(history);
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:300,messages:[{role:"system",content:SYSTEM},...history.map(m=>({role:m.role,content:m.content}))]})});
      const data=await res.json();
      const reply=data.choices?.[0]?.message?.content?.trim()||"I'm right here with you. Take your time.";
      setMessages(p=>[...p,{role:"assistant",content:reply}]);speak(reply);
    }catch{
      const fb="I'm still here with you. Something got quiet — want to try again?";
      setMessages(p=>[...p,{role:"assistant",content:fb}]);speak(fb);
    }
    loadRef.current=false;setAiLoading(false);setMicState("idle");
  },[speak,apiKey]);

  const handleMicTap=useCallback(()=>{
    if(micState==="listening"){recRef.current?.stop();return;}
    if(micState==="processing"||loadRef.current)return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Voice works best in Chrome.");return;}
    ttsRef.current?.cancel();setSpeaking(false);
    const r=new SR();r.lang="en-US";r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
    r.onstart=()=>setMicState("listening");
    r.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join(" ").trim();if(t){setMicState("processing");callFern(t,false);}else setMicState("idle");};
    r.onerror=()=>setMicState("idle");r.onend=()=>setMicState(s=>s==="listening"?"idle":s);
    recRef.current=r;try{r.start();}catch{setMicState("idle");}
  },[micState,callFern]);

  const handleSend=useCallback(()=>{
    const t=inputText.trim();if(!t||loadRef.current||micState!=="idle")return;
    setInputText("");callFern(t,false);
  },[inputText,micState,callFern]);

  const saveMood=()=>{if(!mood)return;const day=new Date().toLocaleDateString("en-US",{weekday:"short"});setMoodHistory(p=>[...p,{mood,note:moodNote,date:day}]);setMoodSaved(true);setMoodNote("");setTimeout(()=>setMoodSaved(false),2500);};
  const toggleMusic=async()=>{if(mBusy)return;setMBusy(true);try{if(mOn){await water.stop();setMOn(false);}else{await water.start();setMOn(true);}}catch(e){console.error(e);}setMBusy(false);};

  if(!apiKey)return <SetupScreen onSave={saveKey}/>;

  const m={mOn,mBusy,mToggle:toggleMusic};

  return <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",background:C.cream,fontFamily:"'Georgia',serif",position:"relative"}}>
    {screen==="home"    &&<HomeScreen streak={streak} mood={mood} setScreen={setScreen} dailyPick={dailyPick} {...m}/>}
    {screen==="talk"    &&<TalkScreen messages={messages} aiLoading={aiLoading} micState={micState} speaking={speaking} inputText={inputText} setInputText={setInputText} handleMicTap={handleMicTap} handleSend={handleSend} {...m}/>}
    {screen==="meditate"&&<MeditateScreen {...m}/>}
    {screen==="mood"    &&<MoodScreen mood={mood} setMood={setMood} note={moodNote} setNote={setMoodNote} saved={moodSaved} save={saveMood} history={moodHistory}/>}
    {screen==="more"    &&<MoreScreen/>}
    <BottomNav screen={screen} setScreen={setScreen}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
